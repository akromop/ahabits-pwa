<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A.Habits — Web widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Базовые стили "как виджет" -->
  <style>
    :root {
      --bg1: #1e1e1e;
      --bg2: #2a2a2a;
      --text: #ffffff;
      --sub: #888888;
      --accent: #00bfff;
      --gray-row: #6f6f6f;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top left, var(--bg2), var(--bg1));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    .widget {
      width: 320px;
      max-width: 100%;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      border-radius: 18px;
      padding: 6px 6px 6px 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    header {
      text-align: center;
      font-size: 10px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 2px;
      margin-bottom: 2px;
    }
    header .dot {
      font-size: 10px;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-inline: 2px;
      padding-bottom: 2px;
    }
    .row {
      display: flex;
      align-items: center;
      font-size: 12px;
      min-height: 18px;
    }
    .row-placeholder {
      color: var(--gray-row);
    }
    .row-left {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-right {
      flex: 0 0 auto;
      font-weight: 600;
      white-space: nowrap;
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }
    .habit-name {
      color: var(--sub);
      font-weight: 600;
    }
    .habit-name.done {
      color: var(--text);
    }
    footer {
      margin-top: 4px;
      padding: 0 2px 2px 2px;
      font-size: 8px;
      color: var(--sub);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    footer .strong {
      font-weight: 700;
    }
    .sep {
      opacity: 0.7;
    }
    .weekly {
      /* цвет для weekly переопределяем инлайн-стилем */
    }
    .error {
      font-size: 11px;
      color: #ff9eb5;
      text-align: center;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <div class="widget">
    <header>
      <span class="dot">•</span>
      <span>calm heart · bright mind</span>
      <span class="dot">•</span>
    </header>

    <main id="list"></main>

    <div id="error" class="error" hidden></div>

    <footer id="footer"></footer>
  </div>

  <script>
    // === CONFIG ===
    const API_BASE =
      "https://script.google.com/macros/s/AKfycbw7kv8ydTrxlgWTaEJhcqa5qoss4TEHh-ElVgQr4xrV38QKPwvCnCdyLHKIbeFIMk0VKw/exec";

    const ICON_SETS = [
      { not: "⚫️", done: "🟢" },
      { not: "⚫️", done: "💎" },
      { not: "⚫️", done: "✨" },
      { not: "⚫️", done: "🌸" },
      { not: "⚫️", done: "☀️" },
    ];
    const ICON_MODE = "sequence"; // "sequence" | "random"

    function pickIconPair() {
      if (!ICON_SETS.length) return { not: "⚪", done: "✅" };
      if (ICON_MODE === "random") {
        return ICON_SETS[Math.floor(Math.random() * ICON_SETS.length)];
      }
      const idx = Math.floor(Date.now() / 86400000) % ICON_SETS.length;
      return ICON_SETS[idx];
    }

    function weeklyOrDailyIcon(item, pair) {
      const t    = String(item.type || "");
      const done = !!item.doneToday;
      const due  = !!item.dueToday;
      if (/^daily/i.test(t))  return done ? pair.done : pair.not;
      if (/^fixed/i.test(t))  return due ? (done ? pair.done : pair.not) : "➖";
      if (/^weekly/i.test(t)) return done ? pair.done : pair.not;
      return "·";
    }

    async function loadData() {
      const listEl   = document.getElementById("list");
      const footerEl = document.getElementById("footer");
      const errorEl  = document.getElementById("error");

      listEl.innerHTML = "";
      footerEl.textContent = "";
      errorEl.hidden = true;

      try {
        const url = `${API_BASE}?endpoint=widget&ts=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        renderList(data);
        renderFooter(data);
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Can't load data. Check GAS URL / CORS.";
        errorEl.hidden = false;
        renderPlaceholders();
      }
    }

    function renderPlaceholders() {
      const listEl = document.getElementById("list");
      listEl.innerHTML = "";
      for (let i = 0; i < 8; i++) {
        const row = document.createElement("div");
        row.className = "row row-placeholder";
        row.textContent = "  ·";
        listEl.appendChild(row);
      }
    }

    function renderList(data) {
      const listEl = document.getElementById("list");
      listEl.innerHTML = "";

      const items = (data && data.items) ? data.items.slice(0, 8) : [];
      const pair = pickIconPair();

      if (!items.length) {
        renderPlaceholders();
        return;
      }

      for (let i = 0; i < 8; i++) {
        const row = document.createElement("div");
        row.className = "row";

        const item = items[i];
        if (!item) {
          row.classList.add("row-placeholder");
          row.textContent = "  ·";
        } else {
          const leftWrap = document.createElement("div");
          leftWrap.className = "row-left";

          const iconSpan = document.createElement("span");
          iconSpan.textContent = weeklyOrDailyIcon(item, pair);

          const nameSpan = document.createElement("span");
          nameSpan.className = "habit-name" + (item.doneToday ? " done" : "");
          nameSpan.textContent = item.habit;

          leftWrap.appendChild(iconSpan);
          leftWrap.appendChild(nameSpan);

          const right = document.createElement("div");
          right.className = "row-right";
          const progStr = String(item.progress || "").trim();
          right.textContent = progStr;

          if (/^weekly/i.test(item.type || "")) {
            const col = (item.weeklyColor || "").trim();
            if (col) right.style.color = col;
            else     right.style.color = "var(--sub)";
          } else if (/^fixed/i.test(item.type || "")) {
            right.style.color = item.doneToday ? "var(--text)" : "var(--sub)";
          } else {
            right.style.color = "var(--sub)";
          }

          row.appendChild(leftWrap);
          row.appendChild(right);
        }

        listEl.appendChild(row);
      }
    }

    function renderFooter(data) {
      const footerEl = document.getElementById("footer");
      footerEl.innerHTML = "";

      const totals = data && data.totals ? data.totals : {};
      const total  = Number(totals.totalDone || 0);
      const pct    = Number(totals.weeklyPercent || 0);
      const xp     = Number(totals.xpWeek || 0);

      const stamp  = data && data.updatedAt ? new Date(data.updatedAt) : new Date();
      const hh = String(stamp.getHours()).padStart(2, "0");
      const mm = String(stamp.getMinutes()).padStart(2, "0");

      function add(text, strong) {
        const span = document.createElement("span");
        span.textContent = text;
        if (strong) span.classList.add("strong");
        footerEl.appendChild(span);
      }
      function sep() {
        const span = document.createElement("span");
        span.textContent = "•";
        span.className = "sep";
        footerEl.appendChild(span);
      }

      add("✨ " + pct + "%", true);
      sep();
      add("Σ " + total, true);
      sep();
      add("⭐ " + (xp >= 0 ? "+" + xp : String(xp)), true);
      sep();
      add(hh + ":" + mm, false);
    }

    document.addEventListener("DOMContentLoaded", loadData);
  </script>
</body>
</html>
