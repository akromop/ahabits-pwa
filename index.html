<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A.Habits — Web Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-top: #1e1e1e;
      --bg-bottom: #2a2a2a;
      --accent: #00bfff;
      --text: #ffffff;
      --sub: #888888;
      --gray-row: #6f6f6f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 380px;
      padding: 8px 10px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Header */

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: var(--accent);
      margin-bottom: 4px;
      text-align: center;
    }

    .header-dot {
      font-size: 10px;
      color: var(--accent);
    }

    .header-text {
      font-weight: 500;
      padding: 0 4px;
    }

    /* Body */

    .list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
    }

    .habit-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      min-height: 20px;
    }

    .habit-toggle {
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      width: 26px;
      text-align: left;
      padding: 0;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.08s ease;
    }

    .habit-toggle.not-done {
      opacity: 0.7;
    }

    .habit-toggle.done {
      opacity: 1;
    }

    .habit-toggle:active {
      transform: scale(0.9);
    }

    .habit-main {
      flex: 1;
      overflow: hidden;
    }

    .habit-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      color: var(--sub);
    }

    .habit-label.done {
      color: var(--text);
    }

    .habit-right {
      margin-left: 6px;
      max-width: 55%;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      font-size: 12px;
    }

    .placeholder {
      color: var(--gray-row);
      font-weight: 600;
    }

    /* Footer */

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      font-size: 8px;
      color: var(--sub);
      gap: 4px;
    }

    .footer span {
      white-space: nowrap;
    }

    .footer-sep {
      opacity: 0.7;
    }

    .footer-pct {
      color: var(--accent);
      font-weight: 700;
    }

    .footer-xp {
      font-weight: 700;
    }

    .footer-xp.positive {
      color: #ffd60a;
    }

    .footer-sum {
      font-weight: 700;
    }

    /* Status */

    .status {
      margin-top: 4px;
      text-align: center;
      font-size: 9px;
      color: var(--sub);
      min-height: 12px;
    }

    .status.error {
      color: #ff9eb5;
    }

    /* Mobile tweaks */

    @media (max-width: 420px) {
      .app {
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <span class="header-dot">•</span>
      <span class="header-text">calm heart · bright mind</span>
      <span class="header-dot">•</span>
    </header>

    <main id="habits-list" class="list">
      <!-- строки привычек рисуются из script.js -->
    </main>

    <div id="status" class="status"></div>

    <footer class="footer">
      <span id="footer-pct" class="footer-pct">✨ 0%</span>
      <span class="footer-sep">·</span>
      <span id="footer-sum" class="footer-sum">Σ 0</span>
      <span class="footer-sep">·</span>
      <span id="footer-xp" class="footer-xp">⭐ +0</span>
      <span class="footer-sep">·</span>
      <span id="footer-time">00:00</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
